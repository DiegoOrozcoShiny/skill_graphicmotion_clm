<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #002aff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <!--
      PLANTILLA DE RAÍZ · Reel Academia HIPA · 1080x1920
      Sustituye DURACION (= voz editada + 3.5 s de cierre), VOZ (duración de la voz editada)
      y VOZ_MAS_04 (VOZ + 0.4). Agrega una línea por escena entre ESCENAS y un <audio> por efecto entre EFECTOS.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="DURACION" data-width="1080" data-height="1920">

      <div id="fondo" data-composition-id="fondo" data-composition-src="compositions/fondo.html" data-start="0" data-duration="DURACION"
           data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>

      <!-- ESCENAS: una por archivo, contiguas (cada una inicia donde termina la anterior). Ejemplo:
      <div id="s01-gancho" data-composition-id="s01-gancho" data-composition-src="compositions/s01-gancho.html" data-start="0" data-duration="7.2"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      -->
      <!-- /ESCENAS -->

      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html" data-start="VOZ" data-duration="3.5"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="transiciones" data-composition-id="transiciones" data-composition-src="compositions/transiciones.html" data-start="0" data-duration="DURACION"
           data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="subtitulos" data-composition-id="subtitulos" data-composition-src="compositions/subtitulos.html" data-start="0" data-duration="DURACION"
           data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:6"></div>
      <div id="maestro" data-composition-id="maestro" data-composition-src="compositions/maestro.html" data-start="0" data-duration="DURACION"
           data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:7"></div>

      <audio id="voz" src="assets/audio/voz.wav" data-start="0" data-duration="VOZ" data-track-index="5" data-volume="1"></audio>

      <!-- EFECTOS: cada uno con su causa en pantalla, ~1 cuadro después de la imagen. Ejemplos:
      <audio id="fx-pop-1" src="assets/audio/sfx/pop.mp3" data-start="1.18" data-duration="0.7" data-track-index="7" data-volume="0.4"></audio>
      <audio id="fx-sello-1" src="assets/audio/sfx/impact-bass-2.mp3" data-start="6.67" data-duration="1.2" data-track-index="6" data-volume="0.45"></audio>
      <audio id="fx-wipe-1" src="assets/audio/sfx/whoosh.mp3" data-start="6.9" data-duration="0.57" data-track-index="9" data-volume="0.3"></audio>
      -->
      <audio id="fx-cierre" src="assets/audio/sfx/impact-bass-2.mp3" data-start="VOZ_MAS_04" data-duration="1.5" data-track-index="6" data-volume="0.45"></audio>
      <!-- /EFECTOS -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
