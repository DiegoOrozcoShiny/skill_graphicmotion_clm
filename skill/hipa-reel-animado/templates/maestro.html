            <path d="M146 170 Q144 92 230 88 Q316 92 314 170 Q316 240 280 266 Q256 282 230 282 Q204 282 180 266 Q144 240 146 170 Z" fill="#d9a27a" stroke="#000" stroke-width="6"/>
            <path d="M144 176 Q138 140 152 118 L166 124 Q156 146 158 176 Z M316 176 Q322 140 308 118 L294 124 Q304 146 302 176 Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
            <path d="M146 150 Q136 112 156 94 L160 78 L176 84 L186 66 L202 76 L214 58 L228 72 L242 56 L256 72 L270 60 L280 78 L296 72 L300 92 Q326 112 314 150 Q304 122 280 116 Q262 108 244 118 Q226 106 206 116 Q184 108 168 122 Q152 130 146 150 Z" fill="#141414" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
            <path d="M180 150 Q198 140 220 146 M240 146 Q262 140 280 150" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" id="m-brows"/>
            <rect x="170" y="160" width="56" height="34" rx="7" fill="#fff" fill-opacity=".3" stroke="#000" stroke-width="5"/>

              <ellipse cx="198" cy="179" rx="6" ry="5" fill="#000"/><ellipse cx="262" cy="179" rx="6" ry="5" fill="#000"/>

            <path d="M186 186 Q198 191 210 186 M250 186 Q262 191 274 186" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" opacity=".5"/>
            <path d="M230 190 Q248 214 236 222 Q226 226 216 218" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" opacity=".5"/>
            <ellipse cx="180" cy="222" rx="14" ry="8" fill="#ff0000" opacity=".12"/>

            <!-- boca: se abre con la voz (pivote arriba, y=246) -->

              <path d="M198 246 Q230 292 262 246 Q230 254 198 246 Z" fill="#000"/>
              <path d="M214 272 Q230 282 246 272 Q230 266 214 272 Z" fill="#ff0000" opacity=".85"/>

            </g>
            <g id="m-stache">
              <path d="M194 236 Q212 224 230 230 Q248 224 266 236 Q262 244 248 241 Q238 238 230 242 Q222 238 212 241 Q198 244 194 236 Z" fill="#2b2b2b" stroke="#000" stroke-width="3"/>

  <script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // --- labio sincronizado con la energía de la voz (30 fps, 0..1) ---
  const M = /*MOUTH*/[];
  tl.set("#m-mouth", { scaleY: 0.22, svgOrigin: "230 246" }, 0);
  for (let i = 0; i < M.length; i++) {
    const v = M[i];
    tl.set("#m-mouth", { scaleY: 0.22 + 0.95 * v, svgOrigin: "230 246" }, i / 30);
    tl.set("#m-stache", { y: -4 * v }, i / 30);
    tl.set("#m-head", { y: -3 * v, rotation: (i % 18 < 9 ? 1 : -1) * 1.2 * v, svgOrigin: "230 280" }, i / 30);
  }
  tl.set("#m-mouth", { scaleY: 0.22, svgOrigin: "230 246" }, M.length / 30);

  // =================== CONFIGURACIÓN POR VIDEO ===================
  // DURACION: duración total del video (voz editada + cierre).
  // POSES: [segundo, ángulo del brazo]. 0 = señala arriba-izquierda (reposo), 35 = dedo arriba,
  //        30 = pensativo, 18/28 = gesticula, -10 = señala con energía, -38 = señala abajo (cierre).
  //        Vuelve a 0 después de cada gesto.
  // ACERCAMIENTOS: [inicio, fin] de escenas "serias" (fondo negro): punch-in + dedo arriba + cejas.
  // CIERRE: segundo en el que empieza el cierre fijo de HIPA.
  const DURACION = 60;
  const POSES = [[3.15, 18], [3.65, 0]];
  const ACERCAMIENTOS = [];
  const CIERRE = 56;
  // ===============================================================

  // --- parpadeo cada ~3,4 s (determinista) ---
  for (let t = 1.8, i = 0; t < DURACION - 0.3; t += 3.1 + (i++ % 3) * 0.45) {
    tl.to("#m-eyes", { scaleY: 0.1, svgOrigin: "230 179", duration: 0.06, ease: "power2.in" }, t);
    tl.to("#m-eyes", { scaleY: 1, svgOrigin: "230 179", duration: 0.09, ease: "power2.out" }, t + 0.08);
  }
  // --- respiración ---
  for (let t = 0; t < DURACION; t += 3.2) {
    tl.to("#m-body", { scaleY: 1.012, svgOrigin: "230 520", duration: 1.6, ease: "sine.inOut" }, t);
    tl.to("#m-body", { scaleY: 1, svgOrigin: "230 520", duration: 1.6, ease: "sine.inOut" }, t + 1.6);
  }
  // --- entrada, poses, acercamientos y cierre ---
  const arm = (t, r, d = 0.35, e = "back.out(1.6)") => tl.to("#m-arm", { rotation: r, svgOrigin: "150 345", duration: d, ease: e }, t);
  tl.set("#m-arm", { rotation: 0, svgOrigin: "150 345" }, 0);
  tl.fromTo("#m-wrap", { y: 60 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, 0);
  POSES.forEach(([t, r]) => arm(t, r));
  ACERCAMIENTOS.forEach(([a, b]) => {
    tl.to("#m-wrap", { scale: 1.32, x: -120, y: -60, duration: 0.45, ease: "expo.out" }, a);
    arm(a + 0.05, 35, 0.4);
    tl.to("#m-brows", { y: -6, duration: 0.2, ease: "power2.out" }, a + 0.1);
    tl.to("#m-wrap", { scale: 1, x: 0, y: 0, duration: 0.4, ease: "power3.inOut" }, b - 0.2);
    tl.to("#m-brows", { y: 0, duration: 0.2 }, b - 0.1);
    arm(b - 0.15, 0, 0.35);
  });
  arm(CIERRE, -38, 0.45);
  tl.to("#m-wrap", { y: -20, duration: 0.4, ease: "back.out(1.6)" }, CIERRE);

  tl.set({}, {}, DURACION);
  window.__timelines["maestro"] = tl;
  </script>
